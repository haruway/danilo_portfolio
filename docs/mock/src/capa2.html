<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mock capa v2</title>
<style>
  @font-face { font-family: 'Overused'; src: url(fonts/OverusedGrotesk-VF.woff2) format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'DM Mono'; src: url(fonts/DMMono-Regular.ttf); font-weight: 400; }
  @font-face { font-family: 'DM Mono'; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
  @font-face { font-family: 'Mayluna'; src: url(fonts/Mayluna.otf); }
  :root { --m: 48px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0A0A0A; color: #fff; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #name { z-index: 2; }
  .mono { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.6; }
  .tr { position: absolute; right: var(--m); bottom: 28px; text-align: right; z-index: 3; }
  .tr ul { list-style: none; }
  .tr li span { opacity: .6; margin-right: .8em; }
  .lang { margin-top: 14px; }
  .lang b { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .tl { position: absolute; left: var(--m); top: 32px; z-index: 3; }

  .name { position: absolute; left: 0; right: 0; top: 0; bottom: 0; font-family: 'Mayluna'; color: #fff; z-index: 2; pointer-events: none; }
  .name span { position: absolute; white-space: nowrap; line-height: 1; }
  .name .l1 { left: 2.2vw; top: 2vh; font-size: 27vw; }
  .name .l2 { left: 17vw; top: 37vh; font-size: 27vw; }
  .write .name .l2 { -webkit-mask-image: linear-gradient(90deg, #000 0 48%, rgba(0,0,0,.0) 52%); mask-image: linear-gradient(90deg, #000 0 48%, transparent 52%); }

  .cue { position: absolute; left: var(--m); bottom: 28px; z-index: 3; }

  @media (max-width: 600px) {
    :root { --m: 16px; }
    .tr li:not(.keep) { display: none; }
    .name .l1 { left: 3vw; top: 34vh; font-size: 41vw; }
    .name .l2 { left: 6vw; top: 52vh; font-size: 40vw; }
    .tr { bottom: 24px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav class="tr mono">
  <ul>
    <li><span>02</span>Manifesto</li>
    <li class="keep"><span>03</span>Trabalhos</li>
    <li><span>04</span>Vídeos</li>
    <li><span>05</span>Lab</li>
    <li class="keep"><span>07</span>Contato</li>
  </ul>
  <div class="lang"><b>PT</b> / EN</div>
</nav>
<canvas id="name"></canvas>
<div class="cue mono">Role a página</div>

<script src="ht.js"></script>
<script src="lines.js"></script>
<script>
  const q = new URLSearchParams(location.search)
  const style = q.get('s') || 'auth'
  if (q.get('f') === 'write') document.body.classList.add('write')
  Promise.all([document.fonts.load('100px Mayluna'), document.fonts.ready]).then(() => {
    const c = document.getElementById('c')
    const W = innerWidth, H = innerHeight
    c.width = W; c.height = H
    const mobile = W < 600
    const s = mobile
      ? { style, cx: W * 0.7, cy: H * 0.17, R: W * 0.2, angle: style === 'tech' ? -32 : 60, period: 5, heat: 30 }
      : { style, cx: W * 0.84, cy: H * 0.27, R: H * 0.15, angle: style === 'tech' ? -32 : 60, period: 7, heat: 46 }
    renderSun(c, s)
    drawName(document.getElementById('name'), W, H, mobile, q.get('f') === 'write')
  })

  // Assinatura medida pelo contorno real das letras (não pela caixa da fonte).
  // Desktop: proporção da arte do Danilo (2560x1440, margem 50px).
  function drawName(cv, W, H, mobile, write) {
    cv.width = W; cv.height = H
    const ctx = cv.getContext('2d')
    const mx = mobile ? 16 : W * 50 / 2560
    const my = mobile ? H * 0.3 : H * 50 / 1440
    const indent = mobile ? 0.07 : 0.197   // onde "Mariani" começa, em fração da largura
    const gap = mobile ? H * 0.008 : H * 0.02
    const box = (t, f) => { ctx.font = f + 'px Mayluna'; const m = ctx.measureText(t); return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent } }
    // tamanho: "Mariani" ocupa de indent*W até a margem direita
    const b100 = box('Mariani', 100)
    const f = 100 * (W - mx - indent * W) / (b100.l + b100.r)
    const b1 = box('Danilo', f), b2 = box('Mariani', f)
    const x1 = mx + b1.l, y1 = my + b1.a
    const x2 = W - mx - b2.r, y2 = y1 + b1.d + gap + b2.a
    ctx.fillStyle = '#fff'
    ctx.font = f + 'px Mayluna'
    ctx.fillText('Danilo', x1, y1)
    if (!write) { ctx.fillText('Mariani', x2, y2); return }
    // quadro do meio da escrita: "Mariani" revelado até ~45%, borda com calor
    const t = document.createElement('canvas'); t.width = W; t.height = H
    const tc = t.getContext('2d'); tc.fillStyle = '#fff'; tc.font = ctx.font; tc.fillText('Mariani', x2, y2)
    const edge = x2 - b2.l + (b2.l + b2.r) * 0.45
    const img = tc.getImageData(0, 0, W, H)
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const e = edge + (fbm(y * 0.02, 1.7) - 0.5) * 90
      const k = Math.min(1, Math.max(0, (e - x) / 30))
      img.data[(y * W + x) * 4 + 3] *= k
    }
    tc.putImageData(img, 0, 0)
    ctx.drawImage(t, 0, 0)
  }
</script>
</body>
</html>
