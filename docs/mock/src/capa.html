<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mock capa</title>
<style>
  @font-face { font-family: 'Overused'; src: url(fonts/OverusedGrotesk-VF.woff2) format('woff2'); font-weight: 300 900; }
  @font-face { font-family: 'DM Mono'; src: url(fonts/DMMono-Regular.ttf); font-weight: 400; }
  @font-face { font-family: 'DM Mono'; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
  @font-face { font-family: 'Mayluna'; src: url(fonts/Mayluna.otf); }
  :root { --black: #0A0A0A; --white: #FFFFFF; --yellow: #FFD21F; --m: 48px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: 'Overused', sans-serif; -webkit-font-smoothing: antialiased; }
  body.A { background: var(--yellow); color: var(--black); }
  body.B { background: var(--black); color: var(--white); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .mono { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.6; }
  .tl { position: absolute; left: var(--m); top: 36px; }
  .tr { position: absolute; right: var(--m); top: 36px; text-align: right; }
  .tr ul { list-style: none; }
  .tr li span { opacity: .55; margin-right: .8em; }
  .lang { margin-top: 18px; }
  .lang b { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  .sig {
    position: absolute; left: calc(var(--m) - 8px); bottom: 34px;
    font-family: 'Mayluna'; font-size: 17.2vw; line-height: .9; white-space: nowrap;
    letter-spacing: -.01em;
  }
  .tese {
    position: absolute; left: var(--m); top: 34vh; width: 320px;
    font-size: 17px; line-height: 1.45; font-weight: 400;
  }
  .tese strong { display: block; font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: -.02em; margin-top: 12px; }
  body.B .tese strong { color: var(--yellow); }

  @media (max-width: 600px) {
    :root { --m: 16px; }
    .tr li:not(.keep) { display: none; }
    .sig { font-size: 25vw; bottom: auto; top: 44vh; white-space: normal; width: 90vw; line-height: .8; }
    .tese { left: var(--m); right: auto; top: auto; bottom: 28px; width: auto; max-width: 300px; font-size: 15px; }
    .tese strong { font-size: 24px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="tl mono">Maringá, PR<br>23°25′S 51°56′W</div>

<nav class="tr mono">
  <ul>
    <li><span>02</span>Manifesto</li>
    <li class="keep"><span>03</span>Trabalhos</li>
    <li><span>04</span>Vídeos</li>
    <li><span>05</span>Lab</li>
    <li class="keep"><span>07</span>Contato</li>
  </ul>
  <div class="lang"><b>PT</b> / EN</div>
</nav>

<div class="sig">Danilo Mariani</div>

<p class="tese">
  Uma marca precisa virar fachada, embalagem, vídeo, post e site. Normalmente isso passa por cinco fornecedores.
  <strong>Aqui passa por um.</strong>
</p>

<script src="ht.js"></script>
<script>
  const q = new URLSearchParams(location.search)
  const V = q.get('v') || 'A'
  const Y = '#' + (q.get('y') || 'FFD21F')
  document.body.classList.add(V)
  document.documentElement.style.setProperty('--yellow', Y)

  document.fonts.ready.then(() => {
  const c = document.getElementById('c')
  const W = innerWidth, H = innerHeight
  c.width = W; c.height = H
  const mobile = W < 600

  // Sol
  const sx = mobile ? W * 0.66 : W * 0.66
  const sy = mobile ? H * 0.31 : H * 0.40
  const SR = mobile ? W * 0.30 : Math.min(W, H) * 0.33

  // zona limpa: a textura não passa por baixo de texto pequeno (nav, rótulos, tese)
  const quietRects = [...document.querySelectorAll('.tl, .tr, .tese')].map(el => {
    const b = el.getBoundingClientRect(); return [b.left - 18, b.top - 14, b.right + 18, b.bottom + 14]
  })
  const quiet = (x, y) => {
    let k = 1
    for (const [l, t, r, b] of quietRects) {
      const dx = Math.max(l - x, 0, x - r), dy = Math.max(t - y, 0, y - b)
      k = Math.min(k, Math.min(1, Math.hypot(dx, dy) / 40))
    }
    return k
  }

  // campo de tinta: sol + papel
  const field = (x, y) => {
    const r = Math.hypot(x - sx, y - sy) / SR
    // núcleo mais quente (menos tinta) -> borda cheia -> halo curto
    if (r < 1) return 0.62 + 0.36 * Math.pow(r, 2.2)
    return 0.98 * Math.exp(-(r - 1) * 9)
  }
  // miragem: ar quente subindo acima e ao redor do sol
  const warp = (x, y) => {
    const above = Math.max(0, 1 - Math.abs(x - sx) / (SR * 1.6)) * Math.max(0, Math.min(1, (sy + SR * 0.6 - y) / (SR * 1.8)))
    const n = fbm(x * 0.006, y * 0.05 + 7.0) - 0.5
    return (n * 22 + Math.sin(x * 0.035 + y * 0.02) * 7) * above
  }

  halftoneDots(c, {
    cell: mobile ? 9 : 12,
    angle: 45,
    ink: V === 'A' ? '#0A0A0A' : Y,
    field: V === 'A' ? (x, y) => field(x, y) * quiet(x, y) : (x, y) => quiet(x, y) * (() => {
      // no preto, o sol é luz: núcleo cheio de amarelo, borda abrindo
      const r = Math.hypot(x - sx, y - sy) / SR
      return r < 1 ? 0.98 - 0.3 * Math.pow(r, 3) : 0.6 * Math.exp(-(r - 1) * 5)
    })(),
    warp
  })
  // papel: retícula fina e quase invisível por baixo de tudo
  {
    const ctx = c.getContext('2d')
    ctx.globalCompositeOperation = 'destination-over'
    const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H
    const paperInk = V === 'A' ? 'rgba(10,10,10,.16)' : '#1a1a1a'
    halftoneDots(tmp, { cell: 7, angle: 45, ink: paperInk, field: (x, y) => 0.06 + 0.22 * fbm(x * 0.003, y * 0.003), warp })
    ctx.drawImage(tmp, 0, 0)
  }
  })
</script>
</body>
</html>
